<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IGOR-PC</title>
</head>
<body>

  <!-- ============ SPERRBILDSCHIRM / LOGIN ============ -->
  <section id="login-screen" class="screen">
    <div class="lock-view" id="lock-view">
      <div id="lock-time" class="lock-time"></div>
      <div id="lock-date" class="lock-date"></div>
      <div class="lock-hint">Klicken oder Taste drücken zum Anmelden</div>
    </div>

    <div class="login-view" id="login-view">
      <div class="login-card" id="login-card">
        <div class="avatar" aria-hidden="true">&#128100;</div>
        <div class="login-name"></div>

        <form id="login-form" class="login-form" autocomplete="off">
          <input id="username" name="username" type="text" placeholder="Benutzername"
                 autocapitalize="off" spellcheck="false" aria-label="Benutzername">

          <div class="pw-row">
            <input id="password" name="password" type="password" placeholder="Kennwort" aria-label="Kennwort">
            <button type="submit" class="pw-submit" aria-label="Anmelden">&#10140;</button>
          </div>

          <p id="login-error" class="login-error" role="alert" hidden></p>

          <button type="button" id="login-back" class="link-btn">Zurück</button>
        </form>
      </div>
    </div>
  </section>

  <!-- ============ DESKTOP ============ -->
  <section id="desktop-screen" class="screen" hidden>
    <div id="desktop"></div>

    <div id="windows"></div>

    <div id="start-menu" hidden>
      <input id="start-search" class="start-search" type="search"
             placeholder="Nach Apps, Dateien und Einstellungen suchen" autocomplete="off">
      <div class="start-label">Angeheftet</div>
      <ul id="start-grid" class="start-grid"></ul>
      <div class="start-label">Zuletzt geöffnet</div>
      <ul id="start-recent" class="start-recent"></ul>
      <div class="start-foot">
        <span class="start-user"><span class="avatar mini" aria-hidden="true">&#128100;</span><span id="start-user-name"></span></span>
        <button id="logout" class="link-btn">&#9211; Abmelden</button>
      </div>
    </div>

    <div id="taskbar">
      <div class="tb-center">
        <button id="start-btn" class="tb-btn start-btn" aria-label="Start">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <rect x="2" y="2" width="9.5" height="9.5" rx="1.5"/>
            <rect x="12.5" y="2" width="9.5" height="9.5" rx="1.5"/>
            <rect x="2" y="12.5" width="9.5" height="9.5" rx="1.5"/>
            <rect x="12.5" y="12.5" width="9.5" height="9.5" rx="1.5"/>
          </svg>
        </button>
        <div id="task-buttons"></div>
      </div>
      <div class="tray" aria-label="Uhrzeit">
        <span id="tray-time" class="tray-time"></span>
        <span id="tray-date" class="tray-date"></span>
      </div>
    </div>
  </section>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
